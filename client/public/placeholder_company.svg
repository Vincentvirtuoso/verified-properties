<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <g fill="none" stroke="#E0E0E0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Decorative Geometry / Blueprint Lines -->
    <circle cx="200" cy="190" r="120" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
    <circle cx="200" cy="190" r="95" stroke-width="1" opacity="0.15" />
    <line x1="200" y1="50" x2="200" y2="310" stroke-width="1" stroke-dasharray="2 4" opacity="0.25" />
    <line x1="60" y1="190" x2="340" y2="190" stroke-width="1" stroke-dasharray="2 4" opacity="0.25" />

    <!-- High-Rise / Commercial Building Silhouette (Background Layer) -->
    <path d="M 215 225 L 215 135 L 265 135 L 265 225 Z" stroke-width="3" fill="none" opacity="0.5" />
    <!-- Window Lines on High-Rise -->
    <line x1="230" y1="155" x2="250" y2="155" stroke-width="2" opacity="0.4" />
    <line x1="230" y1="175" x2="250" y2="175" stroke-width="2" opacity="0.4" />
    <line x1="230" y1="195" x2="250" y2="195" stroke-width="2" opacity="0.4" />

    <!-- Main House Silhouette (Foreground Layer) -->
    <!-- Combined path for roof and walls to ensure clean joints -->
    <path d="M 115 170 L 185 115 L 235 154 L 235 225 L 135 225 L 135 185" stroke-width="4" />
    
    <!-- House Door -->
    <path d="M 155 225 L 155 195 L 175 195 L 175 225" stroke-width="3" />

    <!-- The Key Integration (Weaving out from the foundation) -->
    <!-- Key Shaft extending left -->
    <line x1="135" y1="210" x2="90" y2="210" stroke-width="4" />
    <!-- Key Teeth -->
    <line x1="100" y1="210" x2="100" y2="222" stroke-width="4" />
    <line x1="110" y1="210" x2="110" y2="218" stroke-width="4" />
    <!-- Key Bow (The loop at the end, stylized as a diamond/square) -->
    <path d="M 90 210 L 75 195 L 60 210 L 75 225 Z" stroke-width="3" />
    <circle cx="75" cy="210" r="4" stroke-width="2" />

    <!-- Subtle Horizon/Ground Line -->
    <line x1="105" y1="225" x2="280" y2="225" stroke-width="3" />
  </g>

  <!-- Discreet Text Placeholder -->
  <text x="200" y="290" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="3" 
        fill="#E0E0E0" 
        opacity="0.6">
    COMPANY
  </text>
</svg>
